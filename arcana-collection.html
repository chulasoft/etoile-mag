<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉTOILE Arcana Collection — Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;1,6..96,300&family=Noto+Serif+JP:wght@200;300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#c4956a;--cream:#faf7f2;--dark:#04020d;--dark2:#080422;
  --acc:#c4956a;--acc-rgb:196,149,106;
  --display:'Bodoni Moda',serif;--serif:'Cormorant Garamond',serif;--jp:'Noto Serif JP',serif;--sans:'DM Sans',sans-serif;
}
html{scroll-behavior:smooth;scrollbar-gutter:stable;}
body{background:var(--dark);color:var(--cream);font-family:var(--sans);font-weight:300;cursor:none;user-select:none;overflow-x:hidden;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(ellipse 70% 50% at 50% -5%,rgba(var(--acc-rgb),.12),transparent 60%),
  radial-gradient(ellipse 45% 50% at 12% 78%,rgba(var(--acc-rgb),.05),transparent),
  radial-gradient(ellipse 50% 45% at 88% 82%,rgba(8,5,40,.6),transparent);}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.022;pointer-events:none;z-index:0;}

#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
#glow{position:fixed;width:60vmax;height:60vmax;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(var(--acc-rgb),.05) 0%,transparent 62%);transform:translate(-50%,-50%);transition:background 1.1s ease;left:50%;top:40%;}
#cDot,#cRing{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%);}
#cDot{width:4px;height:4px;background:var(--acc);transition:background .8s;}
#cRing{width:26px;height:26px;border:1px solid rgba(var(--acc-rgb),.35);transition:width .3s,height .3s,border-color .8s;}
body.hov #cRing{width:42px;height:42px;}

#page{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:clamp(40px,7vh,88px) clamp(18px,4vw,48px) clamp(60px,10vh,110px);}

/* HEADER */
.ch-head{text-align:center;margin-bottom:clamp(30px,5vh,54px);}
.ch-eye{font-size:6.5px;letter-spacing:.62em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;opacity:0;animation:fu 1s ease .3s forwards;}
.ch-logo{font-family:var(--display);font-size:clamp(30px,6vw,60px);font-weight:300;letter-spacing:.22em;color:var(--cream);display:flex;justify-content:center;}
.ch-logo span{opacity:0;transform:translateY(26px) rotate(3deg);animation:li .8s cubic-bezier(.22,1,.36,1) forwards;display:inline-block;}
.ch-logo span em{font-style:italic;color:var(--gold);}
@keyframes li{to{opacity:1;transform:none;}}
@keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.ch-sub{font-size:7px;letter-spacing:.55em;color:rgba(250,247,242,.26);margin-top:6px;text-transform:uppercase;opacity:0;animation:fu 1s ease 1.1s forwards;}
.ch-divider{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto 18px;animation:gl 1.7s ease 1.2s forwards;}
@keyframes gl{to{width:140px;}}
/* progress */
.ch-prog{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fu 1s ease 1.4s forwards;}
.ch-prog-txt{font-size:7px;letter-spacing:.5em;text-transform:uppercase;color:rgba(250,247,242,.4);}
.ch-prog-txt b{color:var(--acc);font-weight:400;}
.ch-prog-bar{width:min(280px,60vw);height:2px;background:rgba(250,247,242,.08);border-radius:2px;overflow:hidden;}
.ch-prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width 1.1s cubic-bezier(.22,1,.36,1) .3s;}

/* GRID */
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:clamp(14px,2vw,26px);}
.gcard{position:relative;aspect-ratio:2/3;border-radius:11px;overflow:hidden;transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s,border-color .5s;perspective:900px;opacity:0;transform:translateY(20px);}
.gcard.in{opacity:1;transform:none;}
.gcard-inner{position:absolute;inset:0;border-radius:11px;overflow:hidden;transition:transform .18s ease-out;transform-style:preserve-3d;}

/* discovered */
.gcard.got{cursor:pointer;border:1px solid rgba(var(--gc-rgb),.4);box-shadow:0 10px 30px -14px rgba(var(--gc-rgb),.3);}
.gcard.got:hover{transform:translateY(-6px);box-shadow:0 26px 60px -22px rgba(var(--gc-rgb),.5);border-color:rgba(var(--gc-rgb),.7);}
.gcard.got img{width:100%;height:100%;object-fit:cover;display:block;}
.gcard-foil{position:absolute;inset:0;border-radius:11px;background:
  radial-gradient(ellipse 50% 50% at var(--fx,50%) var(--fy,50%),rgba(255,255,255,.16) 0%,transparent 60%),
  repeating-linear-gradient(calc(100deg + var(--fr,.5)*90deg),rgba(255,0,60,.05),rgba(255,130,0,.05) 10%,rgba(255,250,0,.05) 20%,rgba(0,255,90,.05) 30%,rgba(0,170,255,.05) 40%,rgba(110,0,255,.05) 50%,rgba(255,0,145,.05) 60%,rgba(255,0,60,.05) 70%);
  mix-blend-mode:color-dodge;opacity:0;pointer-events:none;transition:opacity .4s;z-index:3;}
.gcard.got:hover .gcard-foil{opacity:1;}
.gcard-fb{position:absolute;inset:0;background:linear-gradient(155deg,#0e0535,#06021a);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.gcard-fb .fbn{font-family:var(--display);font-size:34px;font-style:italic;color:rgba(var(--gc-rgb),.5);}
.gcard-fb .fbt{font-family:var(--display);font-size:13px;font-style:italic;color:rgba(250,247,242,.55);text-align:center;padding:0 10px;}
.gcard-fb .fbc{font-size:6.5px;letter-spacing:.45em;text-transform:uppercase;color:rgba(var(--gc-rgb),.6);}

/* locked */
.gcard.locked{border:1px solid rgba(var(--acc-rgb),.14);
  background:
    repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(var(--acc-rgb),.018) 7px,rgba(var(--acc-rgb),.018) 8px),
    radial-gradient(ellipse at 50% 0%,rgba(var(--acc-rgb),.1),transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(var(--acc-rgb),.06),transparent 55%),
    linear-gradient(155deg,#07041c,#03010e,#080422);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.gcard.locked::before{content:'';position:absolute;inset:9px;border:1px solid rgba(var(--acc-rgb),.12);border-radius:8px;}
.lock-num{font-family:var(--display);font-size:clamp(24px,4vw,34px);font-style:italic;font-weight:300;color:rgba(var(--acc-rgb),.28);}
.lock-q{width:30px;height:30px;border-radius:50%;border:1px solid rgba(var(--acc-rgb),.2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:15px;color:rgba(var(--acc-rgb),.32);}
.lock-lbl{font-size:5.5px;letter-spacing:.5em;text-transform:uppercase;color:rgba(var(--acc-rgb),.3);}
.lock-char{font-size:6px;letter-spacing:.4em;text-transform:uppercase;color:rgba(250,247,242,.14);}

/* char group headers */
.grp-head{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:clamp(14px,2.5vh,26px) 0 2px;}
.grp-head:first-child{margin-top:0;}
.grp-line{flex:1;height:1px;background:rgba(250,247,242,.06);}
.grp-name{font-size:7px;letter-spacing:.5em;text-transform:uppercase;color:rgba(250,247,242,.32);white-space:nowrap;}
.grp-name b{color:rgb(var(--gc-rgb));font-weight:400;}

/* ACTIONS */
.ch-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:clamp(34px,6vh,60px);}
.cbtn{font-size:7px;letter-spacing:.52em;text-transform:uppercase;padding:12px 30px;border:1px solid;cursor:pointer;background:transparent;font-family:var(--sans);font-weight:300;transition:all .3s;text-decoration:none;display:inline-block;}
.cbtn.p{color:var(--acc);border-color:rgba(var(--acc-rgb),.4);}
.cbtn.p:hover{background:rgba(var(--acc-rgb),.08);}
.cbtn.g{color:rgba(250,247,242,.32);border-color:rgba(250,247,242,.12);}
.cbtn.g:hover{color:rgba(250,247,242,.55);}

/* VIEWER */
#viewer{position:fixed;inset:0;z-index:2000;background:rgba(4,2,10,0);display:flex;align-items:center;justify-content:center;visibility:hidden;transition:background .45s;padding:20px;}
#viewer.open{background:rgba(4,2,10,.96);visibility:visible;}
#viewer-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;transform:scale(.94);transition:opacity .45s,transform .45s;max-height:92vh;}
#viewer.open #viewer-inner{opacity:1;transform:scale(1);}
#viewer-card{position:relative;height:min(72vh,600px);aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:1px solid rgba(var(--vc-rgb),.5);box-shadow:0 30px 90px -20px rgba(var(--vc-rgb),.5);}
#viewer-card img{width:100%;height:100%;object-fit:cover;display:block;}
#viewer-meta{text-align:center;}
.vm-stamp{display:inline-block;font-size:6.5px;letter-spacing:.6em;text-transform:uppercase;color:var(--acc);border:1px solid rgba(var(--acc-rgb),.4);padding:5px 16px;margin-bottom:9px;}
.vm-name{font-family:var(--display);font-size:clamp(19px,3.5vw,26px);font-style:italic;font-weight:300;color:var(--cream);}
.vm-char{font-size:7.5px;letter-spacing:.5em;text-transform:uppercase;color:rgba(250,247,242,.4);margin-top:4px;}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(250,247,242,.2);background:rgba(9,6,20,.55);backdrop-filter:blur(8px);color:var(--cream);font-size:18px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;z-index:5;}
#v-prev{left:-60px;}#v-next{right:-60px;}
.v-nav:hover{border-color:var(--acc);color:var(--acc);}
.v-nav:disabled{opacity:.16;cursor:default;}
#v-close{position:fixed;top:20px;right:20px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(250,247,242,.22);background:rgba(9,6,20,.6);backdrop-filter:blur(8px);color:var(--cream);font-size:14px;cursor:pointer;z-index:2100;display:flex;align-items:center;justify-content:center;transition:all .3s;}
#v-close:hover{border-color:var(--acc);color:var(--acc);}

@media(max-width:560px){
  #cDot,#cRing{display:none;}body{cursor:auto;}
  .coll-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  #v-prev{left:6px;}#v-next{right:6px;}
  #viewer-card{height:auto;width:min(78vw,320px);}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  html{scroll-behavior:auto!important;}
  body{cursor:auto!important;}
  #cDot,#cRing,#stars,#glow{display:none!important;}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="glow"></div>
<div id="cDot"></div><div id="cRing"></div>

<div id="page">
  <header class="ch-head">
    <div class="ch-eye">Apecoft Studio · Arcana Series</div>
    <div class="ch-logo" id="chLogo"></div>
    <div class="ch-sub">Major Arcana · Collection Gallery</div>
    <div class="ch-divider"></div>
    <div class="ch-prog">
      <div class="ch-prog-txt">Discovered <b><span id="pgCount">0</span> / <span id="pgTotal">0</span></b></div>
      <div class="ch-prog-bar"><div class="ch-prog-fill" id="pgFill"></div></div>
    </div>
  </header>

  <div class="coll-grid" id="grid"></div>

  <div class="ch-actions">
    <a class="cbtn p" href="arcana-draw.html" onclick="return goTo('arcana-draw.html',event)">Draw a Card ✦</a>
    <a class="cbtn g" href="index.html" onclick="return goTo('index.html',event)">← All Volumes</a>
    <button class="cbtn g" id="resetBtn">Reset Collection</button>
  </div>
</div>

<!-- VIEWER -->
<div id="viewer">
  <button id="v-close" aria-label="Close">✕</button>
  <div id="viewer-inner">
    <div id="viewer-card">
      <button class="v-nav" id="v-prev" aria-label="Previous">‹</button>
      <img id="v-img" src="" alt="">
      <button class="v-nav" id="v-next" aria-label="Next">›</button>
    </div>
    <div id="viewer-meta">
      <div class="vm-stamp" id="vm-stamp"></div>
      <div class="vm-name" id="vm-name"></div>
      <div class="vm-char" id="vm-char"></div>
    </div>
  </div>
</div>

<script>
const ARC=[
  {num:'XVII',name:'The Star',          char:'Mina',  jp:'ミナ',  color:'#9abfd6',rgb:'154,191,214',img:'arcana/mina_star.png'},
  {num:'XIX', name:'The Sun',           char:'Mina',  jp:'ミナ',  color:'#f0cf6e',rgb:'240,207,110',img:'arcana/mina_sun.png'},
  {num:'VIII',name:'Strength',          char:'Akane', jp:'アカネ',color:'#e09a72',rgb:'224,154,114',img:'arcana/akane_strength.png'},
  {num:'VII', name:'The Chariot',       char:'Akane', jp:'アカネ',color:'#e8995c',rgb:'232,153,92', img:'arcana/akane_the_chariot.png'},
  {num:'XI',  name:'Justice',           char:'Ayame', jp:'アヤメ',color:'#b9c6d8',rgb:'185,198,216',img:'arcana/ayame_justice.png'},
  {num:'II',  name:'The High Priestess',char:'Ayame', jp:'アヤメ',color:'#9aa8c8',rgb:'154,168,200',img:'arcana/ayame_the_high_priestess.png'},
  {num:'VI',  name:'The Lovers',        char:'Rina',  jp:'リナ',  color:'#eda86e',rgb:'237,168,110',img:'arcana/rina_the_lovers.png'},
  {num:'III', name:'The Empress',       char:'Rina',  jp:'リナ',  color:'#dfa648',rgb:'223,166,72', img:'arcana/rina_the_empress.png'},
  {num:'XIV', name:'Temperance',        char:'Shiori',jp:'シオリ',color:'#8fa8d8',rgb:'143,168,216',img:'arcana/shiori_temperance.png'},
  {num:'IX',  name:'The Hermit',        char:'Shiori',jp:'シオリ',color:'#94a0d0',rgb:'148,160,208',img:'arcana/shiori_hermit.png'},
  {num:'XXI', name:'The World',         char:'Suzune',jp:'スズネ',color:'#dfa898',rgb:'223,168,152',img:'arcana/suzune_world.png'},
];
const DISCOVERY_KEY='etoile_arcana_discovered';
let discovered=new Set();
try{discovered=new Set(JSON.parse(localStorage.getItem(DISCOVERY_KEY)||'[]'));}catch(e){}
const REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch=('ontouchstart' in window);

/* header stagger */
(function(){const t=document.getElementById('chLogo');['É','T','O','I','L','E'].forEach((ch,i)=>{const s=document.createElement('span');s.style.animationDelay=(0.4+i*0.08)+'s';s.innerHTML=i===0?ch:`<em>${ch}</em>`;t.appendChild(s);});})();

/* order: group by character in ARC order */
const CHARS=[];
ARC.forEach(c=>{if(!CHARS.includes(c.char))CHARS.push(c.char);});

/* build grid grouped by character */
const grid=document.getElementById('grid');
let discoveredList=[];
CHARS.forEach(charName=>{
  const cards=ARC.filter(c=>c.char===charName);
  const gh=document.createElement('div');
  gh.className='grp-head';
  gh.style.setProperty('--gc-rgb',cards[0].rgb);
  gh.innerHTML=`<div class="grp-line"></div><div class="grp-name"><b>${charName}</b> · ${cards[0].jp}</div><div class="grp-line"></div>`;
  grid.appendChild(gh);
  cards.forEach(c=>{
    const got=discovered.has(c.num);
    const card=document.createElement('div');
    card.className='gcard '+(got?'got':'locked');
    card.style.setProperty('--gc-rgb',c.rgb);
    if(got){
      const gi=discoveredList.length;
      discoveredList.push(c);
      card.innerHTML=`<div class="gcard-inner">
        <img src="${c.img}" alt="${c.name} · ${c.char}" loading="lazy" decoding="async"
             onerror="this.style.display='none';this.parentNode.querySelector('.gcard-fb').style.display='flex';">
        <div class="gcard-fb"><div class="fbn">${c.num}</div><div class="fbt">${c.name}</div><div class="fbc">${c.char}</div></div>
        <div class="gcard-foil"></div>
      </div>`;
      card.addEventListener('click',()=>openViewer(gi));
    }else{
      card.innerHTML=`<div class="lock-num">${c.num}</div><div class="lock-q">?</div><div class="lock-lbl">Undiscovered</div><div class="lock-char">${c.char}</div>`;
    }
    grid.appendChild(card);
  });
});

/* progress */
document.getElementById('pgTotal').textContent=ARC.length;
document.getElementById('pgCount').textContent=discovered.size;
requestAnimationFrame(()=>{document.getElementById('pgFill').style.width=(discovered.size/ARC.length*100)+'%';});

/* reveal-in stagger */
const cardsEls=[...document.querySelectorAll('.gcard')];
if(REDUCE){cardsEls.forEach(c=>c.classList.add('in'));}
else{
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const i=cardsEls.indexOf(e.target);setTimeout(()=>e.target.classList.add('in'),Math.min(i,8)*45);io.unobserve(e.target);}});},{threshold:.1});
  cardsEls.forEach(c=>io.observe(c));
}

/* tilt + foil on discovered (desktop) */
if(!isTouch&&!REDUCE){
  document.querySelectorAll('.gcard.got').forEach(card=>{
    const inner=card.querySelector('.gcard-inner');
    const foil=card.querySelector('.gcard-foil');
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      inner.style.transform=`rotateY(${(x-.5)*8}deg) rotateX(${(y-.5)*-8}deg)`;
      foil.style.setProperty('--fx',`${x*100}%`);foil.style.setProperty('--fy',`${y*100}%`);foil.style.setProperty('--fr',x);
    });
    card.addEventListener('mouseleave',()=>{inner.style.transform='';});
    card.addEventListener('mouseenter',()=>document.body.classList.add('hov'));
    card.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));
  });
}

/* VIEWER */
let vIdx=0;
const viewer=document.getElementById('viewer');
function openViewer(i){vIdx=i;renderViewer();viewer.classList.add('open');document.body.style.overflow='hidden';}
function closeViewer(){viewer.classList.remove('open');document.body.style.overflow='';}
function vNav(d){vIdx=Math.max(0,Math.min(discoveredList.length-1,vIdx+d));renderViewer();}
function renderViewer(){
  const c=discoveredList[vIdx];if(!c)return;
  document.documentElement.style.setProperty('--vc-rgb',c.rgb);
  document.documentElement.style.setProperty('--acc-rgb',c.rgb);
  document.documentElement.style.setProperty('--acc',c.color);
  const img=document.getElementById('v-img');
  img.style.opacity='0';
  setTimeout(()=>{img.src=c.img;img.alt=c.name+' · '+c.char;img.onload=()=>img.style.opacity='1';if(img.complete)img.style.opacity='1';},120);
  img.style.transition='opacity .3s';
  document.getElementById('vm-stamp').textContent='✦ Major Arcana · '+c.num;
  document.getElementById('vm-stamp').style.color=c.color;
  document.getElementById('vm-name').textContent=c.name;
  document.getElementById('vm-char').textContent=c.char+' · '+c.jp;
  document.getElementById('v-prev').disabled=(vIdx===0);
  document.getElementById('v-next').disabled=(vIdx===discoveredList.length-1);
}
document.getElementById('v-prev').addEventListener('click',()=>vNav(-1));
document.getElementById('v-next').addEventListener('click',()=>vNav(1));
document.getElementById('v-close').addEventListener('click',closeViewer);
viewer.addEventListener('click',e=>{if(!document.getElementById('viewer-inner').contains(e.target))closeViewer();});
document.addEventListener('keydown',e=>{
  if(!viewer.classList.contains('open'))return;
  if(e.key==='Escape')closeViewer();
  if(e.key==='ArrowRight')vNav(1);
  if(e.key==='ArrowLeft')vNav(-1);
});
let vtx=0;
viewer.addEventListener('touchstart',e=>{vtx=e.touches[0].clientX;},{passive:true});
viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-vtx;if(Math.abs(dx)>48)vNav(dx<0?1:-1);},{passive:true});

/* reset */
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('Reset your Arcana collection? All discovered cards will be locked again.')){
    try{localStorage.removeItem(DISCOVERY_KEY);}catch(e){}
    location.reload();
  }
});

/* starfield */
const scv=document.getElementById('stars'),sctx=scv.getContext('2d');
let SW,SH,stars=[],mx=innerWidth/2,my=innerHeight/2;
function rs(){SW=scv.width=innerWidth;SH=scv.height=innerHeight;stars=Array.from({length:Math.min(110,SW/12)},()=>({x:Math.random()*SW,y:Math.random()*SH,r:Math.random()*1.2+.3,tw:Math.random()*Math.PI*2,sp:.03+Math.random()*.1}));}
rs();let _rzT;addEventListener('resize',()=>{clearTimeout(_rzT);_rzT=setTimeout(rs,150);});
if(!REDUCE)(function d(){sctx.clearRect(0,0,SW,SH);const px=(mx/SW-.5)*10,py=(my/SH-.5)*7;stars.forEach(s=>{s.tw+=s.sp*.05;const a=.2+Math.abs(Math.sin(s.tw))*.5;sctx.beginPath();sctx.arc(s.x+px*s.r,s.y+py*s.r,s.r,0,Math.PI*2);sctx.fillStyle=`rgba(250,247,242,${a})`;sctx.fill();});requestAnimationFrame(d);})();

/* cursor + glow */
const cd=document.getElementById('cDot'),cr=document.getElementById('cRing'),glow=document.getElementById('glow');
let rx=mx,ry=my,gx=mx,gy=my;
if(!isTouch){
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cd.style.left=mx+'px';cd.style.top=my+'px';});
  (function loop(){rx+=(mx-rx)*.11;ry+=(my-ry)*.11;gx+=(mx-gx)*.04;gy+=(my-gy)*.04;cr.style.left=rx+'px';cr.style.top=ry+'px';glow.style.left=gx+'px';glow.style.top=gy+'px';requestAnimationFrame(loop);})();
}

/* magnetic buttons */
(function(){
  if(isTouch||REDUCE)return;
  document.querySelectorAll('.cbtn,.v-nav').forEach(btn=>{
    const _ct=getComputedStyle(btn).transitionProperty;
    if(!/all|transform/.test(_ct))btn.style.transition=(getComputedStyle(btn).transition||'')+',transform .25s cubic-bezier(.22,1,.36,1)';
    btn.addEventListener('pointermove',e=>{const r=btn.getBoundingClientRect();btn.style.transform=`translate(${(e.clientX-(r.left+r.width/2))*.3}px,${(e.clientY-(r.top+r.height/2))*.3}px)`;});
    btn.addEventListener('pointerleave',()=>{btn.style.transform='';});
    btn.addEventListener('mouseenter',()=>document.body.classList.add('hov'));
    btn.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));
  });
})();

/* nav */
let _leaving=false;
function goTo(url,ev){
  if(ev)ev.preventDefault();
  if(_leaving)return false;_leaving=true;
  if(REDUCE){location.href=url;return false;}
  document.body.style.transition='opacity .42s ease,filter .42s ease,transform .42s ease';
  document.body.style.opacity='0';document.body.style.filter='blur(3px)';document.body.style.transform='scale(.992)';
  setTimeout(()=>location.href=url,420);
  return false;
}
</script>
