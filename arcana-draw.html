<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉTOILE Arcana Collection — Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;1,6..96,300&family=Noto+Serif+JP:wght@200;300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#c4956a;--cream:#faf7f2;--dark:#04020d;--dark2:#080422;
  --acc:#c4956a;--acc-rgb:196,149,106;
  --display:'Bodoni Moda',serif;--jp:'Noto Serif JP',serif;--sans:'DM Sans',sans-serif;
  --cw:300px;--ch:450px;
}
html,body{min-height:100%;}
body{background:var(--dark);color:var(--cream);font-family:var(--sans);font-weight:300;cursor:none;user-select:none;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity 1.4s;
  background:
    radial-gradient(ellipse 70% 55% at 50% -5%,rgba(var(--acc-rgb),.14),transparent 60%),
    radial-gradient(ellipse 45% 50% at 12% 75%,rgba(var(--acc-rgb),.05),transparent),
    radial-gradient(ellipse 50% 45% at 88% 80%,rgba(8,5,40,.7),transparent);}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.022;pointer-events:none;z-index:0;}

/* STARFIELD */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* CURSOR */
#cDot,#cRing{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%);}
#cDot{width:4px;height:4px;background:var(--acc);transition:background .8s;}
#cRing{width:26px;height:26px;border:1px solid rgba(var(--acc-rgb),.35);transition:width .3s,height .3s,border-color .8s;}
body.hov #cRing{width:42px;height:42px;}

/* FLASH + accessibility */
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.85),rgba(var(--acc-rgb),.3) 40%,transparent 70%);opacity:0;pointer-events:none;z-index:800;}
#flash.go{animation:flashA .55s ease-out;}
@keyframes flashA{0%{opacity:0;}18%{opacity:.9;}100%{opacity:0;}}

/* PAGE */
#page{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,3.5vh,44px) 20px;padding-bottom:max(clamp(18px,3.5vh,44px),env(safe-area-inset-bottom,0px) + 40px);gap:clamp(16px,3vh,34px);}

/* HEADER */
.arc-header{text-align:center;}
.arc-eye{font-size:6.5px;letter-spacing:.62em;color:var(--gold);text-transform:uppercase;margin-bottom:9px;opacity:0;animation:fu 1s ease .3s forwards;}
.arc-logo{font-family:var(--display);font-size:clamp(26px,5vw,54px);font-weight:300;letter-spacing:.22em;color:var(--cream);display:flex;justify-content:center;}
.arc-logo span{opacity:0;transform:translateY(26px) rotate(3deg);animation:li .8s cubic-bezier(.22,1,.36,1) forwards;display:inline-block;}
.arc-logo span em{font-style:italic;color:var(--gold);}
@keyframes li{to{opacity:1;transform:none;}}
.arc-sub{font-size:6.5px;letter-spacing:.55em;color:rgba(250,247,242,.24);margin-top:5px;text-transform:uppercase;opacity:0;animation:fu 1s ease 1.1s forwards;}
.arc-divider{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:11px auto 0;animation:gl 1.7s ease 1.2s forwards;}
@keyframes gl{to{width:130px;}}
@keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* SCENE */
#scene{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,28px);}

/* DECK AREA */
#deck-area{position:relative;width:var(--cw);height:var(--ch);overflow:visible;animation:deckFloat 5s ease-in-out infinite;}
@keyframes deckFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
#deck-area.busy{animation:none;}

/* RAYS behind card */
#rays{position:absolute;left:50%;top:50%;width:640px;height:640px;transform:translate(-50%,-50%) scale(0);border-radius:50%;pointer-events:none;z-index:1;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(var(--acc-rgb),.14) 0deg 7deg,transparent 7deg 24deg);
  -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.9) 0%,transparent 68%);
  mask-image:radial-gradient(circle,rgba(0,0,0,.9) 0%,transparent 68%);
  transition:transform 1s cubic-bezier(.22,1,.36,1),opacity .8s;}
#rays.on{transform:translate(-50%,-50%) scale(1);opacity:1;animation:raysSpin 26s linear infinite;}
@keyframes raysSpin{to{rotate:360deg;}}

/* AURA behind revealed card */
#aura{position:absolute;left:50%;top:50%;width:130%;height:115%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse,rgba(var(--acc-rgb),.3),transparent 65%);transition:opacity 1s;filter:blur(18px);}
#aura.on{opacity:1;animation:auraPulse 2.6s ease-in-out infinite;}
@keyframes auraPulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.07);}}

/* SHOCKWAVE RING */
.ring{position:absolute;left:50%;top:50%;width:40px;height:40px;border:2px solid rgba(var(--acc-rgb),.7);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:600;animation:ringX .9s cubic-bezier(.2,.6,.3,1) forwards;}
@keyframes ringX{0%{width:60px;height:60px;opacity:1;border-width:2.5px;}100%{width:560px;height:560px;opacity:0;border-width:.5px;}}

/* STATIC DECK */
.sdl{position:absolute;inset:0;border-radius:14px;
  background:
    repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(var(--acc-rgb),.02) 7px,rgba(var(--acc-rgb),.02) 8px),
    repeating-linear-gradient(-45deg,transparent,transparent 7px,rgba(var(--acc-rgb),.02) 7px,rgba(var(--acc-rgb),.02) 8px),
    radial-gradient(ellipse at 50% 0%,rgba(var(--acc-rgb),.14),transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(var(--acc-rgb),.08),transparent 55%),
    linear-gradient(155deg,#07041c,#03010e,#080422);
  border:1px solid rgba(var(--acc-rgb),.26);transition:opacity .4s ease;z-index:3;}
#sdl1{transform:rotate(-2.5deg) translateY(9px) translateX(-5px);opacity:.32;}
#sdl2{transform:rotate(-1.1deg) translateY(4px) translateX(-2px);opacity:.52;}
#sdl3{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:.8;overflow:hidden;}
#sdl3::before{content:'';position:absolute;inset:10px;border:1px solid rgba(var(--acc-rgb),.16);border-radius:9px;}
.sdl-oc{position:absolute;width:18px;height:18px;border-color:rgba(var(--acc-rgb),.2);border-style:solid;}
.sdl-oc.tl{top:13px;left:13px;border-width:1px 0 0 1px;}
.sdl-oc.tr{top:13px;right:13px;border-width:1px 1px 0 0;}
.sdl-oc.bl{bottom:13px;left:13px;border-width:0 0 1px 1px;}
.sdl-oc.br{bottom:13px;right:13px;border-width:0 1px 1px 0;}
.sdl-star{font-size:14px;color:rgba(var(--acc-rgb),.22);letter-spacing:6px;}
.sdl-logo{font-family:var(--display);font-size:22px;font-weight:300;letter-spacing:.28em;color:rgba(var(--acc-rgb),.5);}
.sdl-logo em{font-style:italic;}
.sdl-label{font-size:6px;letter-spacing:.62em;color:rgba(var(--acc-rgb),.26);text-transform:uppercase;}

/* FAN CARDS */
.fan-card{position:absolute;inset:0;border-radius:14px;cursor:pointer;z-index:4;
  background:
    repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(var(--acc-rgb),.02) 7px,rgba(var(--acc-rgb),.02) 8px),
    radial-gradient(ellipse at 50% 0%,rgba(var(--acc-rgb),.14),transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(var(--acc-rgb),.08),transparent 55%),
    linear-gradient(155deg,#07041c,#03010e,#080422);
  border:1px solid rgba(var(--acc-rgb),.28);
  transform-origin:bottom center;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .35s ease,box-shadow .5s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;}
.fan-card.lit{box-shadow:0 16px 50px -16px rgba(var(--acc-rgb),.4);}
.fan-card::before{content:'';position:absolute;inset:10px;border:1px solid rgba(var(--acc-rgb),.16);border-radius:9px;pointer-events:none;}
.fan-card .fc-logo{font-family:var(--display);font-size:20px;font-weight:300;letter-spacing:.28em;color:rgba(var(--acc-rgb),.5);}
.fan-card .fc-logo em{font-style:italic;}
.fan-card .fc-star{font-size:13px;color:rgba(var(--acc-rgb),.22);letter-spacing:6px;}

/* DRAW CARD */
#draw-card{position:absolute;inset:0;perspective:1200px;z-index:20;display:none;}
.ci{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:none;}
.cf{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.back{
  background:
    repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(var(--acc-rgb),.022) 7px,rgba(var(--acc-rgb),.022) 8px),
    repeating-linear-gradient(-45deg,transparent,transparent 7px,rgba(var(--acc-rgb),.022) 7px,rgba(var(--acc-rgb),.022) 8px),
    radial-gradient(ellipse at 50% 0%,rgba(var(--acc-rgb),.15),transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(var(--acc-rgb),.09),transparent 55%),
    linear-gradient(155deg,#07041c,#03010e,#080422);
  border:1px solid rgba(var(--acc-rgb),.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;}
.back::before{content:'';position:absolute;inset:10px;border:1px solid rgba(var(--acc-rgb),.17);border-radius:9px;}
.oc{position:absolute;width:18px;height:18px;border-color:rgba(var(--acc-rgb),.22);border-style:solid;}
.oc.tl{top:13px;left:13px;border-width:1px 0 0 1px;}
.oc.tr{top:13px;right:13px;border-width:1px 1px 0 0;}
.oc.bl{bottom:13px;left:13px;border-width:0 0 1px 1px;}
.oc.br{bottom:13px;right:13px;border-width:0 1px 1px 0;}
.bl{font-family:var(--display);font-size:22px;font-weight:300;letter-spacing:.28em;color:rgba(var(--acc-rgb),.52);}
.bl em{font-style:italic;}
.bs{font-size:15px;color:rgba(var(--acc-rgb),.22);letter-spacing:7px;}
.bb{font-size:6px;letter-spacing:.62em;color:rgba(var(--acc-rgb),.26);text-transform:uppercase;}

/* FRONT — full 2:3 art, no text bar */
.front{transform:rotateY(180deg);overflow:hidden;border:1px solid rgba(var(--acc-rgb),.45);background:var(--dark2);box-shadow:0 0 0 0 rgba(var(--acc-rgb),0);transition:box-shadow .8s;}
.ci.rev .front{box-shadow:0 24px 80px -20px rgba(var(--acc-rgb),.45);}
.front img{width:100%;height:100%;object-fit:cover;display:block;}
.fi-fb{position:absolute;inset:0;background:linear-gradient(155deg,#0e0535,#06021a);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.fb-num{font-family:var(--display);font-size:64px;font-style:italic;color:rgba(var(--acc-rgb),.12);}
.fb-name{font-family:var(--display);font-size:18px;font-style:italic;color:rgba(250,247,242,.5);}
.fb-char{font-size:7px;letter-spacing:.5em;text-transform:uppercase;color:rgba(var(--acc-rgb),.5);}

/* FOIL V2 — stronger */
.foil{position:absolute;inset:0;border-radius:14px;
  background:
    radial-gradient(ellipse 50% 50% at var(--fx,50%) var(--fy,50%),rgba(255,255,255,.22) 0%,transparent 60%),
    repeating-linear-gradient(calc(100deg + var(--fr,.5)*90deg),
      rgba(255,0,60,.06),rgba(255,130,0,.06) 9%,rgba(255,250,0,.06) 18%,
      rgba(0,255,90,.06) 27%,rgba(0,170,255,.06) 36%,rgba(110,0,255,.06) 45%,
      rgba(255,0,145,.06) 54%,rgba(255,0,60,.06) 63%);
  mix-blend-mode:color-dodge;opacity:0;pointer-events:none;transition:opacity .4s;}
.shimmer{position:absolute;inset:0;border-radius:14px;background:radial-gradient(ellipse 26% 26% at var(--fx,50%) var(--fy,50%),rgba(255,255,255,.1),transparent);mix-blend-mode:screen;opacity:0;pointer-events:none;transition:opacity .3s;}
.ci.rev .foil,.ci.rev .shimmer{opacity:1;}

/* FLOATING SPARKLES around revealed card */
.fsp{position:fixed;pointer-events:none;z-index:550;color:var(--acc);font-size:var(--sz,10px);animation:fspA var(--d,2.4s) ease-out forwards;text-shadow:0 0 8px rgba(var(--acc-rgb),.8);}
@keyframes fspA{0%{opacity:0;transform:translateY(0) scale(.4) rotate(0deg);}15%{opacity:1;}100%{opacity:0;transform:translateY(-90px) scale(1) rotate(180deg);}}

/* PROMPT */
#prompt{text-align:center;transition:opacity .4s;}
#prompt.hide{opacity:0;pointer-events:none;}
.pt{font-family:var(--jp);font-size:9px;letter-spacing:.4em;color:rgba(250,247,242,.24);margin-bottom:13px;}
.ph{display:flex;align-items:center;justify-content:center;gap:7px;}
.pd{width:3px;height:3px;border-radius:50%;background:var(--acc);animation:bl2 2s infinite;}
.pd:nth-child(2){animation-delay:.28s;}.pd:nth-child(3){animation-delay:.56s;}
.ptx{font-size:6.5px;letter-spacing:.52em;text-transform:uppercase;color:rgba(250,247,242,.2);}
@keyframes bl2{0%,100%{opacity:.15;}50%{opacity:.85;}}

/* CARD INFO */
#card-info{text-align:center;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s;pointer-events:none;}
#card-info.on{opacity:1;transform:none;pointer-events:auto;}
.ci-stamp{display:inline-block;font-size:6.5px;letter-spacing:.6em;text-transform:uppercase;color:var(--acc);border:1px solid rgba(var(--acc-rgb),.4);padding:5px 16px 5px 19px;margin-bottom:11px;transition:color .8s,border-color .8s;}
.ci-nm{font-family:var(--display);font-size:clamp(20px,4vw,30px);font-style:italic;font-weight:300;color:var(--cream);}
.ci-ch{font-size:7.5px;letter-spacing:.5em;text-transform:uppercase;color:rgba(250,247,242,.38);margin-top:4px;}

/* BUTTONS */
#btn-area{display:flex;gap:12px;opacity:0;transform:translateY(10px);transition:opacity .5s .22s,transform .5s .22s;pointer-events:none;}
#btn-area.on{opacity:1;transform:none;pointer-events:auto;}
.ab{font-size:7px;letter-spacing:.52em;text-transform:uppercase;padding:10px 26px;border:1px solid;cursor:pointer;background:transparent;font-family:var(--sans);font-weight:300;transition:all .3s;}
.ab.p{color:var(--acc);border-color:rgba(var(--acc-rgb),.4);}
.ab.p:hover{background:rgba(var(--acc-rgb),.08);}
.ab.g{color:rgba(250,247,242,.32);border-color:rgba(250,247,242,.12);}
.ab.g:hover{color:rgba(250,247,242,.55);}

/* COLLECTION STRIP */
#coll{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:520px;}
.coll-lbl{font-size:6.5px;letter-spacing:.5em;text-transform:uppercase;color:rgba(250,247,242,.2);width:100%;text-align:center;margin-bottom:6px;}
.cslot{width:26px;height:39px;border-radius:3px;border:1px solid rgba(250,247,242,.1);background:rgba(250,247,242,.025);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:7px;font-style:italic;color:rgba(250,247,242,.18);transition:all .6s cubic-bezier(.22,1,.36,1);}
.cslot.got{color:#06030f;font-weight:400;transform:translateY(-3px);box-shadow:0 6px 16px -6px rgba(0,0,0,.5);}

/* PARTICLES */
.particle{position:fixed;pointer-events:none;border-radius:50%;z-index:500;animation:pf var(--d,.7s) ease-out var(--dl,0s) forwards;}
@keyframes pf{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(0);}}
.sliver{position:fixed;pointer-events:none;z-index:500;border-radius:2px;animation:pf var(--d,.7s) ease-out var(--dl,0s) forwards;}

@media(max-width:560px){
  :root{--cw:210px;--ch:315px;}
  #cDot,#cRing{display:none;}body{cursor:auto;}
  #rays{width:440px;height:440px;}
  /* tall reveal state (card+info+buttons+strip) must scroll fully into reach */
  #page{justify-content:flex-start;padding-top:max(20px,env(safe-area-inset-top,0px) + 12px);}
  #coll{margin-top:4px;}
}

/* ═══ ACCESSIBILITY: reduced motion + pointer gating (design-taste pre-flight) ═══ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  html{scroll-behavior:auto!important;}
  body{cursor:auto!important;}
  #cDot,#cRing,#stars,#motes,#snow,#flies,#glow,#rays,#aura{display:none!important;}
}
@media (pointer:coarse),(hover:none){
  body{cursor:auto!important;}
  #cDot,#cRing{display:none!important;}
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="flash"></div>
<div id="cDot"></div><div id="cRing"></div>

<div id="page">
  <header class="arc-header">
    <div class="arc-eye">Apecoft Studio · Arcana Series</div>
    <div class="arc-logo" id="arcLogo"></div>
    <div class="arc-sub">Major Arcana Collection</div>
    <div class="arc-divider"></div>
  </header>

  <div id="scene">
    <div id="deck-area">
      <div id="rays"></div>
      <div id="aura"></div>
      <div class="sdl" id="sdl1"></div>
      <div class="sdl" id="sdl2"></div>
      <div class="sdl" id="sdl3">
        <div class="sdl-oc tl"></div><div class="sdl-oc tr"></div>
        <div class="sdl-oc bl"></div><div class="sdl-oc br"></div>
        <div class="sdl-star">✦ ✦ ✦</div>
        <div class="sdl-logo">É<em>TOILE</em></div>
        <div class="sdl-label">Arcana Collection</div>
      </div>
      <div id="draw-card">
        <div class="ci" id="ci">
          <div class="cf back">
            <div class="oc tl"></div><div class="oc tr"></div>
            <div class="oc bl"></div><div class="oc br"></div>
            <div class="bs">✦ ✦ ✦</div>
            <div class="bl">É<em>TOILE</em></div>
            <div class="bb">Arcana Collection</div>
          </div>
          <div class="cf front" id="front">
            <img id="fimg" src="" alt="" onerror="this.style.display='none';document.getElementById('ffb').style.display='flex'">
            <div class="fi-fb" id="ffb">
              <div class="fb-num" id="fbnum"></div>
              <div class="fb-name" id="fbname"></div>
              <div class="fb-char" id="fbchar"></div>
            </div>
            <div class="foil" id="foil"></div>
            <div class="shimmer" id="shim"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="prompt">
      <div class="pt">カードをシャッフルして引いてください</div>
      <div class="ph"><div class="pd"></div><div class="pd"></div><div class="pd"></div><div class="ptx">Click to shuffle &amp; draw</div></div>
    </div>

    <div id="card-info">
      <div class="ci-stamp" id="cistamp">✦ Major Arcana</div>
      <div class="ci-nm" id="cinm"></div>
      <div class="ci-ch" id="cich"></div>
    </div>
    <div id="btn-area">
      <button class="ab g" onclick="returnCard()">↩ Return</button>
      <button class="ab p" onclick="returnCard()">Draw Again ✦</button>
    </div>

    <div id="coll">
      <div class="coll-lbl">Discovered <span id="collCount">0</span> / <span id="collTotal"></span></div>
    </div>
  </div>
</div>

<script>
/* ══ DATA — ÉTOILE Arcana Collection ══ */
const ARC=[
  {num:'XVII',name:'The Star',          char:'Mina',  jp:'ミナ',  color:'#9abfd6',rgb:'154,191,214',img:'arcana/mina_star.png'},
  {num:'XIX', name:'The Sun',           char:'Mina',  jp:'ミナ',  color:'#f0cf6e',rgb:'240,207,110',img:'arcana/mina_sun.png'},
  {num:'VIII',name:'Strength',          char:'Akane', jp:'アカネ',color:'#e09a72',rgb:'224,154,114',img:'arcana/akane_strength.png'},
  {num:'VII', name:'The Chariot',       char:'Akane', jp:'アカネ',color:'#e8995c',rgb:'232,153,92', img:'arcana/akane_the_chariot.png'},
  {num:'XI',  name:'Justice',           char:'Ayame', jp:'アヤメ',color:'#b9c6d8',rgb:'185,198,216',img:'arcana/ayame_justice.png'},
  {num:'II',  name:'The High Priestess',char:'Ayame', jp:'アヤメ',color:'#9aa8c8',rgb:'154,168,200',img:'arcana/ayame_the_high_priestess.png'},
  {num:'VI',  name:'The Lovers',        char:'Rina',  jp:'リナ',  color:'#eda86e',rgb:'237,168,110',img:'arcana/rina_the_lovers.png'},
  {num:'III', name:'The Empress',       char:'Rina',  jp:'リナ',  color:'#dfa648',rgb:'223,166,72', img:'arcana/rina_the_empress.png'},
  {num:'XIV', name:'Temperance',        char:'Shiori',jp:'シオリ',color:'#8fa8d8',rgb:'143,168,216',img:'arcana/shiori_temperance.png'},
  {num:'IX',  name:'The Hermit',        char:'Shiori',jp:'シオリ',color:'#94a0d0',rgb:'148,160,208',img:'arcana/shiori_hermit.png'},
  {num:'XXI', name:'The World',         char:'Suzune',jp:'スズネ',color:'#dfa898',rgb:'223,168,152',img:'arcana/suzune_world.png'},
];

/* ══ HEADER STAGGER ══ */
(function(){
  const t=document.getElementById('arcLogo');
  ['É','T','O','I','L','E'].forEach((ch,i)=>{
    const s=document.createElement('span');
    s.style.animationDelay=(0.4+i*0.08)+'s';
    s.innerHTML=i===0?ch:`<em>${ch}</em>`;
    t.appendChild(s);
  });
})();

/* ══ STARFIELD ══ */
const scv=document.getElementById('stars'),sctx=scv.getContext('2d');
let SW,SH,stars=[];
function resizeS(){
  SW=scv.width=innerWidth;SH=scv.height=innerHeight;
  stars=Array.from({length:Math.min(120,SW/11)},()=>({
    x:Math.random()*SW,y:Math.random()*SH,
    r:Math.random()*1.2+.3,
    tw:Math.random()*Math.PI*2,sp:.03+Math.random()*.1,
  }));
}
resizeS();addEventListener('resize',resizeS);
let mx=innerWidth/2,my=innerHeight/2;
if(!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))(function drawS(){
  sctx.clearRect(0,0,SW,SH);
  const px=(mx/SW-.5)*10,py=(my/SH-.5)*7;
  stars.forEach(s=>{
    s.tw+=s.sp*.05;
    const a=.2+Math.abs(Math.sin(s.tw))*.5;
    sctx.beginPath();
    sctx.arc(s.x+px*s.r,s.y+py*s.r,s.r,0,Math.PI*2);
    sctx.fillStyle=`rgba(250,247,242,${a})`;
    sctx.fill();
  });
  requestAnimationFrame(drawS);
})();

/* ══ STATE ══ */
let deck=[...ARC].sort(()=>Math.random()-.5);
let idx=0,busy=false,revealed=false;
const discovered=new Set();
let sparkleTimer=null;

const deckArea=document.getElementById('deck-area');
const drawCard=document.getElementById('draw-card');
const ci=document.getElementById('ci');
const info=document.getElementById('card-info');
const btns=document.getElementById('btn-area');
const prompt=document.getElementById('prompt');
const rays=document.getElementById('rays');
const aura=document.getElementById('aura');

/* collection strip */
(function(){
  const coll=document.getElementById('coll');
  document.getElementById('collTotal').textContent=ARC.length;
  ARC.forEach(c=>{
    const d=document.createElement('div');
    d.className='cslot';d.id='cslot-'+c.num;
    d.textContent=c.num;
    coll.appendChild(d);
  });
})();
function markDiscovered(card){
  discovered.add(card.num);
  document.getElementById('collCount').textContent=discovered.size;
  const slot=document.getElementById('cslot-'+card.num);
  if(slot&&!slot.classList.contains('got')){
    slot.classList.add('got');
    slot.style.background=card.color;
    slot.style.borderColor=card.color;
  }
}

function setAcc(rgb,hex){
  document.documentElement.style.setProperty('--acc-rgb',rgb);
  document.documentElement.style.setProperty('--acc',hex);
}
function loadCard(c){
  const img=document.getElementById('fimg');
  img.style.display='block';
  document.getElementById('ffb').style.display='none';
  img.src=c.img;
  document.getElementById('fbnum').textContent=c.num;
  document.getElementById('fbname').textContent=c.name;
  document.getElementById('fbchar').textContent=c.char+' · '+c.jp;
}

/* ══ SHUFFLE + DRAW ══ */
const SPREAD=[
  {x:-285,y:28,r:-28},{x:-195,y:10,r:-17},{x:-100,y:-2,r:-8},
  {x:0,y:-8,r:0},
  {x:100,y:-2,r:8},{x:195,y:10,r:17},{x:285,y:28,r:28},
];
function makeFanCard(){
  const d=document.createElement('div');
  d.className='fan-card';
  d.innerHTML=`<div class="fc-star">✦ ✦ ✦</div><div class="fc-logo">É<em>TOILE</em></div>`;
  return d;
}

deckArea.style.cursor='pointer';
deckArea.addEventListener('click',onDeckClick);

function onDeckClick(){
  if(busy||revealed)return;
  busy=true;
  prompt.classList.add('hide');
  deckArea.classList.add('busy');
  document.querySelectorAll('.sdl').forEach(d=>d.style.opacity='0');

  const cards=SPREAD.map(()=>{const c=makeFanCard();deckArea.appendChild(c);return c;});

  /* Phase 1: spread */
  requestAnimationFrame(()=>{
    cards.forEach((c,i)=>{
      const p=SPREAD[i];
      c.style.transition='transform .52s cubic-bezier(.4,0,.2,1),opacity .3s ease';
      c.style.transform=`translateX(${p.x}px) translateY(${p.y}px) rotate(${p.r}deg)`;
      c.style.opacity=i===3?'1':'0.82';
      c.classList.add('lit');
    });
  });

  /* Phase 2: pair-swap shuffle */
  setTimeout(()=>{
    [[0,6],[1,5],[2,4]].forEach(([li,ri],step)=>{
      const delay=step*160;
      setTimeout(()=>{
        const lp=SPREAD[li],rp=SPREAD[ri];
        cards[li].style.transition=`transform ${.28+step*.04}s cubic-bezier(.4,0,.2,1)`;
        cards[li].style.transform=`translateX(${-lp.x*.1}px) translateY(-18px) rotate(${-lp.r*.3}deg)`;
        cards[ri].style.transition=`transform ${.28+step*.04}s cubic-bezier(.4,0,.2,1)`;
        cards[ri].style.transform=`translateX(${-rp.x*.1}px) translateY(-18px) rotate(${-rp.r*.3}deg)`;
      },delay);
      setTimeout(()=>{
        [li,ri].forEach(i2=>{
          cards[i2].style.transition='transform .22s cubic-bezier(.2,0,.4,1),opacity .2s';
          const small=(Math.random()-0.5)*3;
          cards[i2].style.transform=`translateX(${small}px) translateY(${Math.random()*2}px) rotate(${small*.4}deg)`;
          cards[i2].style.opacity='0.7';
        });
      },delay+260);
    });
    setTimeout(()=>{cards[3].style.transition='transform .22s ease';cards[3].style.transform='translateY(-10px)';},200);
    setTimeout(()=>{cards[3].style.transition='transform .22s ease';cards[3].style.transform='translateY(0)';},420);
  },600);

  /* Phase 3: stack */
  setTimeout(()=>{
    cards.forEach((c,i)=>{
      c.style.transition=`transform .38s cubic-bezier(.4,0,.2,1) ${i*.02}s,opacity .3s ease ${i*.02}s`;
      const micro=(Math.random()-0.5)*1.4;
      c.style.transform=`translateX(${micro}px) translateY(${Math.random()*1}px) rotate(${micro*.3}deg)`;
      c.style.opacity=i===6?'1':(i>3?0.68:0.45);
      c.classList.remove('lit');
    });
  },1350);

  /* Phase 4: draw + reveal spectacle */
  setTimeout(()=>{
    cards.forEach(c=>c.remove());
    drawCard.style.display='block';
    drawCard.style.transform='none';

    const card=deck[idx%deck.length];idx++;
    if(idx%deck.length===0)deck=[...ARC].sort(()=>Math.random()-.5);
    loadCard(card);
    setAcc(card.rgb,card.color);

    setTimeout(()=>{
      drawCard.style.transition='transform .32s cubic-bezier(.4,0,.2,1)';
      drawCard.style.transform='translateY(-22px) scale(1.04)';
    },60);

    /* rays awaken just before flip */
    setTimeout(()=>{rays.classList.add('on');},260);

    setTimeout(()=>{
      ci.style.transition='transform .88s cubic-bezier(.25,.8,.25,1)';
      ci.style.transform='rotateY(180deg)';
    },420);

    /* flash + ring at flip apex */
    setTimeout(()=>{
      const f=document.getElementById('flash');
      f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
      spawnRing();
    },820);

    setTimeout(()=>{
      ci.classList.add('rev');
      aura.classList.add('on');
      revealed=true;busy=false;

      document.getElementById('cistamp').textContent='✦ Major Arcana · '+card.num;
      document.getElementById('cinm').textContent=card.name;
      document.getElementById('cich').textContent=card.char+' · '+card.jp;
      info.classList.add('on');btns.classList.add('on');
      markDiscovered(card);

      const r=drawCard.getBoundingClientRect();
      burst(r.left+r.width/2,r.top+r.height/2,card.color);
      startSparkles(card.color);
    },1180);
  },1750);
}

function returnCard(){
  if(busy)return;busy=true;
  btns.classList.remove('on');info.classList.remove('on');
  rays.classList.remove('on');aura.classList.remove('on');
  stopSparkles();

  setTimeout(()=>{
    ci.style.transition='transform .62s cubic-bezier(.25,.8,.25,1)';
    ci.style.transform='rotateY(0deg)';ci.classList.remove('rev');
  },140);
  setTimeout(()=>{
    drawCard.style.transition='transform .52s cubic-bezier(.22,1,.36,1)';
    drawCard.style.transform='none';
    revealed=false;
  },640);
  setTimeout(()=>{
    drawCard.style.display='none';
    setAcc('196,149,106','#c4956a');
    document.getElementById('sdl1').style.opacity='';
    document.getElementById('sdl2').style.opacity='';
    document.getElementById('sdl3').style.opacity='';
    deckArea.classList.remove('busy');
    prompt.classList.remove('hide');
    busy=false;
  },1020);
}

/* ══ FX ══ */
function spawnRing(){
  const r=deckArea.getBoundingClientRect();
  const ring=document.createElement('div');
  ring.className='ring';
  ring.style.left=(r.left+r.width/2)+'px';
  ring.style.top=(r.top+r.height/2)+'px';
  ring.style.position='fixed';
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(),950);
}
function burst(cx,cy,color){
  for(let i=0;i<44;i++){
    const p=document.createElement('div');p.className='particle';
    const a=(i/44)*Math.PI*2+(Math.random()-.5)*.5;
    const dist=60+Math.random()*170;
    const sz=1.5+Math.random()*4.5;
    const d=.5+Math.random()*.7;const dl=Math.random()*.18;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${color};--tx:${Math.cos(a)*dist}px;--ty:${Math.sin(a)*dist}px;--d:${d}s;--dl:${dl}s;box-shadow:0 0 ${sz*2}px ${color};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),(d+dl)*1000+120);
  }
  for(let i=0;i<10;i++){
    const p=document.createElement('div');p.className='sliver';
    const a=Math.random()*Math.PI*2;
    const dist=40+Math.random()*110;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:1.5px;height:${8+Math.random()*14}px;background:${color};--tx:${Math.cos(a)*dist}px;--ty:${Math.sin(a)*dist}px;--d:${.4+Math.random()*.5}s;transform:translate(-50%,-50%) rotate(${a}rad);box-shadow:0 0 6px ${color};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1100);
  }
}
function startSparkles(color){
  stopSparkles();
  sparkleTimer=setInterval(()=>{
    if(!revealed)return;
    const r=drawCard.getBoundingClientRect();
    const s=document.createElement('div');
    s.className='fsp';s.textContent='✦';
    const x=r.left+Math.random()*r.width;
    const y=r.top+r.height*(0.2+Math.random()*0.8);
    s.style.cssText=`left:${x}px;top:${y}px;--sz:${7+Math.random()*9}px;--d:${1.8+Math.random()*1.4}s;color:${color};`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3400);
  },420);
}
function stopSparkles(){if(sparkleTimer){clearInterval(sparkleTimer);sparkleTimer=null;}}

/* ══ FOIL + TILT ══ */
let tt;
drawCard.addEventListener('mousemove',e=>{
  if(!revealed)return;
  const r=drawCard.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  ci.style.transition='transform .07s linear';
  ci.style.transform=`rotateY(${180+(x-.5)*22}deg) rotateX(${(y-.5)*-22}deg)`;
  document.getElementById('foil').style.setProperty('--fx',`${x*100}%`);
  document.getElementById('foil').style.setProperty('--fy',`${y*100}%`);
  document.getElementById('foil').style.setProperty('--fr',x);
  document.getElementById('shim').style.setProperty('--fx',`${x*100}%`);
  document.getElementById('shim').style.setProperty('--fy',`${y*100}%`);
  clearTimeout(tt);
});
drawCard.addEventListener('mouseleave',()=>{
  if(!revealed)return;
  tt=setTimeout(()=>{
    ci.style.transition='transform .78s cubic-bezier(.34,1.36,.64,1)';
    ci.style.transform='rotateY(180deg)';
  },55);
});

/* ══ CURSOR ══ */
const cd=document.getElementById('cDot'),cr=document.getElementById('cRing');
let rx=mx,ry=my;
if(!('ontouchstart' in window)){
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cd.style.left=mx+'px';cd.style.top=my+'px';});
  (function loop(){rx+=(mx-rx)*.11;ry+=(my-ry)*.11;cr.style.left=rx+'px';cr.style.top=ry+'px';requestAnimationFrame(loop);})();
  [deckArea,...document.querySelectorAll('.ab')].forEach(el=>{
    el.addEventListener('mouseenter',()=>document.body.classList.add('hov'));
    el.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));
  });
}
</script>
