<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉTOILE — Our Girls</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;1,6..96,300&family=Noto+Serif+JP:wght@200;300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pink:#e2adc0;--blue:#9abfd6;--warm:#c4956a;--gold:#c4a464;
  --cream:#faf7f2;--ink:#0c0910;--dark:#07050a;--dark2:#100c14;
  --muted:#7a6872;--muted2:#4e4050;
  --display:'Bodoni Moda',serif;--serif:'Cormorant Garamond',serif;
  --jp:'Noto Serif JP',serif;--sans:'DM Sans',sans-serif;
}
html,body{min-height:100%;overflow-x:hidden;scrollbar-gutter:stable;}
body{background:var(--dark);color:var(--cream);font-family:var(--sans);font-weight:300;cursor:none;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:0.028;pointer-events:none;z-index:200;}
#cDot,#cRing{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%);}
#cDot{width:5px;height:5px;background:var(--gold);}
#cRing{width:28px;height:28px;border:1px solid rgba(196,164,100,.4);transition:width .3s,height .3s;}
body.hov #cRing{width:50px;height:50px;}
header{position:fixed;top:0;left:0;right:0;z-index:500;padding:18px clamp(20px,5vw,60px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(7,5,10,.85),transparent);}
.h-logo{font-family:var(--display);font-size:clamp(15px,2vw,20px);font-weight:300;letter-spacing:.3em;color:var(--cream);}
.h-logo em{font-style:italic;color:var(--gold);}
.h-back{font-size:7px;letter-spacing:.45em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:color .25s;}
.h-back:hover{color:var(--cream);}
.hero{min-height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(100px,14vh,150px) clamp(20px,5vw,60px) clamp(32px,5vh,60px);}
.hero-pre{font-size:8px;letter-spacing:.7em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;opacity:0;animation:fu 1s ease .3s forwards;}
.hero-title{font-family:var(--display);font-size:clamp(36px,7vw,86px);font-weight:300;letter-spacing:.12em;color:var(--cream);line-height:1;opacity:0;animation:fu 1.3s ease .6s forwards;}
.hero-title em{font-style:italic;color:var(--gold);}
.hero-line{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto;animation:gl 1.5s ease 1.1s forwards;}
.hero-sub{font-family:var(--jp);font-weight:200;font-size:9px;letter-spacing:.5em;color:var(--muted);opacity:0;animation:fu 1s ease 1.4s forwards;}
.gallery{max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,48px) clamp(60px,10vh,120px);}
.og-row{display:grid;border:0.5px solid rgba(250,247,242,.06);border-radius:4px;overflow:hidden;margin-bottom:clamp(10px,1.5vw,18px);cursor:pointer;opacity:0;transform:translateY(24px);transition:opacity .85s ease,transform .85s ease,border-color .3s;}
.og-row.on{opacity:1;transform:none;}
.og-row:nth-child(2){transition-delay:.1s;}.og-row:nth-child(3){transition-delay:.2s;}.og-row:nth-child(4){transition-delay:.3s;}
.og-row:hover{border-color:rgba(250,247,242,.14);}
.og-row.lft{grid-template-columns:58% 1fr;}
.og-row.rgt{grid-template-columns:1fr 58%;}
.og-row:hover .og-img-inner{transform:scale(1.04);}
.og-img{position:relative;overflow:hidden;}
.og-img-inner{width:100%;aspect-ratio:3/2;background:var(--dark2);position:relative;overflow:hidden;transition:transform .75s cubic-bezier(.4,0,.2,1);}
.og-img-inner img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.88) brightness(.9);transition:filter .5s;}
.og-row:hover .og-img-inner img{filter:saturate(1.02) brightness(.97);}
.og-overlay{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 20px;background:linear-gradient(to top,rgba(6,4,10,.92),transparent);}
.og-dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-bottom:7px;}
.og-name-en{font-family:var(--display);font-size:clamp(26px,4vw,44px);font-weight:300;font-style:italic;color:var(--cream);line-height:1;}
.og-name-jp{font-family:var(--jp);font-size:9px;letter-spacing:.4em;color:rgba(250,247,242,.3);margin-top:3px;}
.og-side{background:var(--dark2);padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.og-idx{position:absolute;font-family:var(--serif);font-size:120px;font-weight:300;font-style:italic;line-height:1;color:rgba(250,247,242,.04);pointer-events:none;transition:color .3s;}
.og-row.lft .og-idx{right:-8px;bottom:-18px;}.og-row.rgt .og-idx{left:-8px;bottom:-18px;}
.og-row:hover .og-idx{color:rgba(250,247,242,.08);}
.og-top{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;}
.og-tags{display:flex;flex-wrap:wrap;gap:5px;}.og-tags.r{justify-content:flex-end;}
.og-tag{font-size:7px;letter-spacing:.28em;text-transform:uppercase;padding:3px 9px;border:0.5px solid rgba(250,247,242,.12);border-radius:20px;color:var(--muted);}
.og-motto-jp{font-family:var(--jp);font-size:clamp(13px,1.6vw,17px);font-weight:200;line-height:1.8;letter-spacing:.05em;color:var(--cream);margin-top:4px;}
.og-motto-en{font-family:var(--serif);font-size:clamp(10px,1.1vw,12px);font-style:italic;line-height:1.6;color:rgba(250,247,242,.38);margin-top:2px;}
.og-motto-en.r,.og-motto-jp.r{text-align:right;}
.og-cta{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:0.5px solid rgba(250,247,242,.07);position:relative;z-index:1;}
.og-cta-lbl{font-size:7px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);}
.og-arr{font-size:18px;color:var(--muted);transition:transform .25s,color .25s;}
.og-row:hover .og-arr{transform:translateX(5px);color:var(--cream);}
/* DETAIL */
.det{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s;}
.det.open{opacity:1;pointer-events:auto;}
.det-bg{position:absolute;inset:0;background:rgba(5,3,8,.92);backdrop-filter:blur(18px);cursor:pointer;}
.det-panel{position:relative;z-index:1;background:var(--dark2);width:min(96vw,1040px);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:346px 1fr;max-height:93vh;border:0.5px solid rgba(250,247,242,.1);transform:translateY(22px);transition:transform .45s ease;}
.det.open .det-panel{transform:none;}
.det-close{position:absolute;top:13px;right:13px;width:27px;height:27px;border-radius:50%;border:0.5px solid rgba(250,247,242,.18);background:rgba(7,5,10,.6);cursor:pointer;font-size:13px;color:rgba(250,247,242,.55);display:flex;align-items:center;justify-content:center;z-index:25;transition:all .2s;}
.det-close:hover{background:var(--dark);color:var(--cream);}
.portrait-area{position:relative;background:#08050a;overflow:hidden;aspect-ratio:2/3;}
.portrait-frame{position:absolute;inset:0;transition:opacity .65s cubic-bezier(.4,0,.2,1),transform .65s cubic-bezier(.4,0,.2,1),filter .65s ease;}
.portrait-frame.hidden{opacity:0;transform:scale(1.04);filter:brightness(1.18) saturate(.6);pointer-events:none;}
.portrait-frame.visible{opacity:1;transform:scale(1);filter:brightness(1) saturate(1);}
.portrait-inner{width:100%;height:100%;overflow:hidden;cursor:zoom-in;position:relative;}
.portrait-inner img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform .6s ease;}
.portrait-inner:hover img{transform:scale(1.025);}
/* FOIL EFFECT */
.portrait-foil{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity .3s ease;z-index:3;
  mix-blend-mode:color-dodge;
  background:
    radial-gradient(ellipse 80% 60% at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14) 0%,transparent 55%),
    repeating-linear-gradient(var(--fr,105deg),
      rgba(255,50,100,.2),rgba(255,180,50,.2) 14%,
      rgba(80,255,140,.2) 28%,rgba(40,190,255,.2) 42%,
      rgba(140,50,255,.2) 56%,rgba(255,50,200,.2) 70%,
      rgba(255,50,100,.2) 84%);
}
.portrait-inner:hover .portrait-foil{opacity:1;}
/* SPARKLE */
@keyframes sp{0%,100%{opacity:0;transform:scale(0) rotate(0deg);}50%{opacity:.9;transform:scale(1) rotate(180deg);}}
.portrait-sparkle{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease;z-index:4;}
.portrait-inner:hover .portrait-sparkle{opacity:1;}
.portrait-sparkle i{
  position:absolute;display:block;
  background:white;
  clip-path:polygon(50% 0%,53% 47%,100% 50%,53% 53%,50% 100%,47% 53%,0% 50%,47% 47%);
  animation:sp var(--dur,1.4s) var(--del,0s) ease-in-out infinite;
  will-change:transform,opacity;
}
/* TABS */
.tab-strip{position:absolute;left:346px;bottom:0;display:flex;flex-direction:column;gap:2px;padding-bottom:18px;z-index:20;}
.ptab{width:15px;height:34px;background:rgba(16,12,20,.9);border:0.5px solid rgba(250,247,242,.1);border-left:none;border-radius:0 3px 3px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:6px;letter-spacing:.15em;color:rgba(250,247,242,.35);writing-mode:vertical-rl;transition:width .2s ease,background .2s,color .2s;}
.ptab:hover{width:22px;background:var(--dark2);color:rgba(250,247,242,.7);}
.ptab.active{width:22px;background:var(--dark2);color:var(--cream);}
.det-info{padding:22px 22px 20px 24px;overflow-y:auto;display:flex;flex-direction:column;}
.di-name{font-family:var(--display);font-size:34px;font-weight:300;font-style:italic;line-height:1;color:var(--cream);}
.di-jp{font-family:var(--jp);font-weight:200;font-size:9px;letter-spacing:.45em;color:var(--muted);margin:3px 0 16px;}
.di-motto{font-family:var(--serif);font-size:13px;font-style:italic;line-height:1.7;color:rgba(250,247,242,.55);border-left:1.5px solid rgba(250,247,242,.15);padding-left:10px;margin-bottom:16px;}
.di-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px;}
.di-tag{font-size:7px;letter-spacing:.28em;text-transform:uppercase;padding:3px 9px;border:0.5px solid rgba(250,247,242,.12);border-radius:20px;color:var(--muted);}
.di-sec{font-size:7px;letter-spacing:.55em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px;}
.radar-svg{width:100%;max-width:200px;display:block;margin:0 auto;}
.di-footer{margin-top:auto;padding-top:12px;display:flex;justify-content:flex-end;border-top:0.5px solid rgba(250,247,242,.07);}
.di-read{font-size:7px;letter-spacing:.45em;text-transform:uppercase;padding:5px 14px;border:0.5px solid rgba(250,247,242,.18);border-radius:3px;color:var(--muted);background:transparent;cursor:pointer;transition:all .25s;}
.di-read:hover{border-color:rgba(250,247,242,.4);color:var(--cream);}
footer{padding:clamp(24px,4vh,40px) clamp(20px,5vw,60px);border-top:0.5px solid rgba(250,247,242,.05);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.ft-logo{font-family:var(--display);font-size:13px;font-weight:300;letter-spacing:.3em;color:rgba(250,247,242,.2);}
.ft-logo em{font-style:italic;color:rgba(196,164,100,.35);}
.ft-copy{font-size:7px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted2);}
@keyframes fu{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes gl{to{width:160px;}}
/* COLOR STRIP (gallery card) */
.og-color-strip{display:flex;align-items:center;gap:11px;padding:9px 12px;border:0.5px solid rgba(250,247,242,.07);border-radius:3px;margin-bottom:16px;background:rgba(250,247,242,.02);}
.og-color-swatch{width:28px;height:28px;border-radius:2px;flex-shrink:0;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.12);}
.og-color-lbl{font-size:7.5px;letter-spacing:.36em;text-transform:uppercase;color:rgba(250,247,242,.24);margin-bottom:3px;}
.og-color-val{font-size:11.5px;color:rgba(250,247,242,.68);letter-spacing:.04em;}
/* VOLUME BADGE (detail popup) */
.di-vol{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.di-vol-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.di-vol-num{font-size:8px;letter-spacing:.48em;text-transform:uppercase;color:rgba(250,247,242,.28);}
/* STAT HIGHLIGHTS */
.di-stats-row{display:flex;align-items:center;gap:12px;margin-top:4px;}
.di-stats-row .radar-svg{flex:1;max-width:210px;display:block;margin:0 auto;}
.di-stat-card{flex:0 0 78px;text-align:center;padding:14px 8px;border-radius:4px;}
.di-stat-lbl{font-size:7px;letter-spacing:.38em;text-transform:uppercase;margin-bottom:7px;}
.di-stat-val{font-family:var(--serif);font-size:32px;line-height:1;}
.di-stat-name{font-size:8px;letter-spacing:.18em;text-transform:uppercase;margin-top:6px;}
/* POLAROID LIGHTBOX */
.plbox{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease;}
.plbox.open{opacity:1;pointer-events:auto;}
.plbox-bg{position:absolute;inset:0;background:rgba(4,2,8,.9);backdrop-filter:blur(28px);cursor:pointer;}
.polar-scene{position:relative;z-index:1;perspective:1600px;}
.polar-card{
  width:min(400px,84vw);
  transform-style:preserve-3d;
  transform:rotateY(180deg);
  transition:transform 1.05s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
}
.polar-card.revealed{transform:rotateY(0deg) rotate(-1.8deg);}
.polar-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative;}
/* laser pattern shared */
.polar-front,.polar-back{
  background:
    repeating-linear-gradient(45deg,transparent 0,transparent 22px,rgba(196,164,100,.048) 22px,rgba(196,164,100,.048) 23px),
    repeating-linear-gradient(-45deg,transparent 0,transparent 22px,rgba(196,164,100,.048) 22px,rgba(196,164,100,.048) 23px),
    repeating-linear-gradient(0deg,transparent 0,transparent 11px,rgba(196,164,100,.016) 11px,rgba(196,164,100,.016) 12px),
    radial-gradient(ellipse 90% 55% at 8% 8%,rgba(196,164,100,.13) 0%,transparent 55%),
    radial-gradient(ellipse 65% 90% at 92% 92%,rgba(120,95,215,.09) 0%,transparent 52%),
    radial-gradient(ellipse 55% 45% at 90% 8%,rgba(196,164,100,.07) 0%,transparent 48%),
    linear-gradient(160deg,#1e1828 0%,#150f1e 55%,#1a1224 100%);
}
/* FRONT — photo side */
.polar-front{
  padding:18px 18px 58px;
  box-shadow:0 32px 64px rgba(0,0,0,.72),0 8px 24px rgba(0,0,0,.38);
  overflow:hidden;
}
.polar-photo{width:100%;aspect-ratio:2/3;overflow:hidden;background:#150f1e;box-shadow:0 0 0 1px rgba(196,164,100,.15),0 6px 20px rgba(0,0,0,.5);position:relative;}
.polar-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;filter:saturate(.92) brightness(.95);}
.polar-label{text-align:center;padding-top:13px;font-family:var(--serif);font-style:italic;font-size:10px;letter-spacing:.22em;color:rgba(196,164,100,.45);}
/* BACK — ด้านที่แสดงก่อน */
.polar-back{
  position:absolute;inset:0;
  transform:rotateY(180deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:32px;
  box-shadow:0 32px 64px rgba(0,0,0,.72),0 8px 24px rgba(0,0,0,.38);
  overflow:hidden;
}
.polar-back::before{content:'';position:absolute;inset:14px;border:0.5px solid rgba(196,164,100,.18);pointer-events:none;z-index:1;}
/* FOIL — เฉพาะบนรูปภาพ, ลด intensity */
.polar-foil{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity .35s ease;z-index:10;
  mix-blend-mode:color-dodge;
  background:
    radial-gradient(ellipse 75% 55% at var(--mx,50%) var(--my,50%),rgba(255,255,255,.08) 0%,transparent 55%),
    repeating-linear-gradient(var(--fr,105deg),
      rgba(255,50,100,.10),rgba(255,180,50,.10) 14%,
      rgba(80,255,140,.10) 28%,rgba(40,190,255,.10) 42%,
      rgba(140,50,255,.10) 56%,rgba(255,50,200,.10) 70%,
      rgba(255,50,100,.10) 84%);
}
.polar-card.revealed:hover .polar-foil{opacity:1;}
.polar-back-logo{font-size:7px;letter-spacing:.55em;text-transform:uppercase;color:rgba(196,164,100,.45);position:relative;z-index:1;}
.polar-back-name{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(42px,10vw,62px);
  background:linear-gradient(135deg,#c9a84c 0%,#f0d97a 35%,#e2c160 60%,#a87c2a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 18px rgba(196,164,100,.35)) drop-shadow(0 2px 4px rgba(0,0,0,.6));
  line-height:1;letter-spacing:.03em;position:relative;z-index:1;
}
.polar-back-sub{font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:rgba(196,164,100,.3);position:relative;z-index:1;}
.plbox-hint{position:absolute;bottom:clamp(16px,3vh,28px);left:50%;transform:translateX(-50%);font-size:7px;letter-spacing:.45em;text-transform:uppercase;color:rgba(250,247,242,.2);white-space:nowrap;}
@media(max-width:768px){
  #cDot,#cRing{display:none;}body{cursor:auto;}
  .gallery{padding:0 14px 60px;}
  .og-row.lft,.og-row.rgt{grid-template-columns:1fr;}
  .og-side{padding:16px;}.og-idx{font-size:80px;}
  /* detail panel: scroll as one column, portrait capped so name+info stay reachable */
  .det{align-items:flex-start;}
  .det-panel{grid-template-columns:1fr;display:block;width:94vw;max-height:92svh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:4vh auto;border-radius:10px;transform:translateY(22px);}
  .portrait-area{aspect-ratio:2/3;max-height:50svh;width:100%;}
  .det-info{overflow:visible;padding:20px 18px 24px;}
  .di-name{font-size:30px;}
  /* keep close button tappable while the panel scrolls */
  .det-close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;width:34px;height:34px;font-size:15px;background:rgba(7,5,10,.82);backdrop-filter:blur(8px);z-index:1300;}
  .tab-strip{left:auto;right:0;padding-bottom:12px;}
  /* polaroid: bound by BOTH width and viewport height so it never overflows */
  .polar-card{width:min(400px,84vw,54vh);}
  .plbox-hint{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);}
  footer{flex-direction:column;align-items:center;text-align:center;}
}

/* ═══════════ V2 — CONSTELLATION LAYER ═══════════ */
:root{--acc:#c4a464;--acc-rgb:196,164,100;}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
#glow{position:fixed;width:62vmax;height:62vmax;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(var(--acc-rgb),.05) 0%,transparent 62%);transform:translate(-50%,-50%);transition:background 1.1s ease;left:50%;top:40%;}
header,.hero,.gallery,footer{position:relative;z-index:1;}
#cDot{background:var(--acc);transition:background .8s;}
#cRing{border-color:rgba(var(--acc-rgb),.4);transition:width .3s,height .3s,border-color .8s;}
#rp{position:fixed;top:0;left:0;right:0;height:2px;z-index:600;}
#rp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#c4a464);transition:width .08s linear,background 1s ease;}
/* hero letter stagger */
.hero-title{display:flex;justify-content:center;gap:.22em;}
.hero-title span{opacity:0;transform:translateY(30px) rotate(3deg);animation:hLi .85s cubic-bezier(.22,1,.36,1) forwards;display:inline-block;}
@keyframes hLi{to{opacity:1;transform:none;}}
.hero-title span em{font-style:italic;color:var(--gold);}
/* names ticker */
#g-ticker{position:relative;z-index:1;border-top:0.5px solid rgba(250,247,242,.05);border-bottom:0.5px solid rgba(250,247,242,.05);padding:11px 0;overflow:hidden;background:rgba(16,12,20,.4);margin-bottom:clamp(28px,5vh,56px);}
.gt-track{display:flex;gap:42px;white-space:nowrap;animation:gtk 34s linear infinite;width:max-content;}
.gt-track span{font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:rgba(250,247,242,.22);}
.gt-track span i{font-style:normal;}
@keyframes gtk{to{transform:translateX(-50%);}}
/* row star + shine + tilt */
.og-star{display:inline-block;font-size:11px;margin-bottom:7px;transition:transform .6s cubic-bezier(.34,1.4,.64,1);}
.og-row:hover .og-star{transform:rotate(180deg) scale(1.3);}
.og-shine{position:absolute;inset:0;background:radial-gradient(ellipse 45% 35% at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.08),transparent 70%);opacity:0;transition:opacity .4s;pointer-events:none;z-index:3;}
.og-row:hover .og-shine{opacity:1;}
.og-img-inner{perspective:900px;}
.og-img-inner img{will-change:transform;}
/* hover glow border in girl color */
.og-row{transition:opacity .85s ease,transform .85s ease,border-color .4s,box-shadow .5s;}
.og-row:hover{box-shadow:0 24px 70px -30px rgba(var(--row-rgb,250,247,242),.28);border-color:rgba(var(--row-rgb,250,247,242),.32)!important;}
/* burst particles */
.gparticle{position:fixed;pointer-events:none;border-radius:50%;z-index:1500;animation:gpf var(--d,.7s) ease-out var(--dl,0s) forwards;}
@keyframes gpf{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(0);}}
/* detail panel accent dot pulse — cute */
.di-vol-dot{animation:dotPulse 2.2s ease infinite;}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.4);}50%{box-shadow:0 0 0 5px rgba(var(--acc-rgb),0);}}

/* ═══ ACCESSIBILITY: reduced motion + pointer gating (design-taste pre-flight) ═══ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  html{scroll-behavior:auto!important;}
  body{cursor:auto!important;}
  #cDot,#cRing,#stars,#motes,#snow,#flies,#glow,#rays,#aura{display:none!important;}
}
@media (pointer:coarse),(hover:none){
  body{cursor:auto!important;}
  #cDot,#cRing{display:none!important;}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="glow"></div>
<div id="rp"><div id="rp-fill"></div></div>
<div id="cDot"></div><div id="cRing"></div>
<header>
  <div class="h-logo">É<em>TOILE</em></div>
  <div class="h-back" onclick="goTo('index.html')">← All Volumes</div>
</header>
<section class="hero">
  <div class="hero-pre">ÉTOILE · Apecoft Studio</div>
  <div class="hero-title" id="heroTitle"></div>
  <div class="hero-line"></div>
  <div class="hero-sub">エトワールを彩る、彼女たちの物語。</div>
</section>
<div id="g-ticker"><div class="gt-track" id="gtTrack"></div></div>
<section class="gallery" id="gallery"></section>

  <div class="ft-logo">É<em>TOILE</em></div>

</footer>
<div class="det" id="detWrap">

<!-- POLAROID LIGHTBOX -->

  <div class="polar-scene">
    <div class="polar-card" id="polarCard" onclick="flipPolar(event)">
      <div class="polar-face polar-front">
        <div class="polar-photo">
          <img id="polarImg" src="" alt="">

        </div>

      </div>
      <div class="polar-face polar-back">
        <div class="polar-back-logo">ÉTOILE PROJECT</div>
        <div class="polar-back-name" id="polarName"></div>
        <div class="polar-back-sub" id="polarSub"></div>
      </div>
    </div>
  </div>
  <div class="plbox-hint">Tap card to reveal · Tap outside to close</div>
</div>
<script src="girls/girls-data.js"></script>
<script>
// ── Render gallery cards from GIRLS[] ─────────────────────────
function renderGallery(){
  const wrap=document.getElementById('gallery');
  GIRLS.forEach((g,i)=>{
    const dir=i%2===0?'lft':'rgt';
    const idx=String(i+1).padStart(2,'0');
    const r=dir==='rgt';
    const imgBlock=`
      <div class="og-img">
        <div class="og-img-inner">
          <img src="${g.gallery.src}" alt="${g.name}" style="object-position:${g.gallery.pos||'center top'};">
        </div>
        <div class="og-shine"></div>
        <div class="og-overlay">
          <div class="og-star" style="color:${g.color};">✦</div>
          <div class="og-name-en">${g.name}</div>
          <div class="og-name-jp">${g.jp}</div>
        </div>
      </div>`;
    const colorHex=g.color.toUpperCase();
    const colorStrip=`
      <div class="og-color-strip">
        <div class="og-color-swatch" style="background:${g.color};"></div>
        <div>
          <div class="og-color-lbl">Signature Color</div>
          <div class="og-color-val">${g.colorName} &nbsp;·&nbsp; ${colorHex}</div>
        </div>
      </div>`;
    const sideBlock=`
      <div class="og-side"${r?' style="text-align:right;"':''}>
        <div class="og-idx">${idx}</div>
        <div class="og-top">
          <div class="og-tags${r?' r':''}">${g.tags.slice(0,3).map(t=>`<span class="og-tag">${t}</span>`).join('')}</div>
          <div class="og-motto-jp${r?' r':''}">${g.motto_jp}</div>
          <div class="og-motto-en${r?' r':''}">${g.motto_en}</div>
        </div>
        ${colorStrip}
        <div class="og-cta"><span class="og-cta-lbl">Meet ${g.name}</span><span class="og-arr">→</span></div>
      </div>`;
    const row=document.createElement('div');
    const rowRgb=g.color.replace('#','').match(/../g).map(h=>parseInt(h,16)).join(',');
    row.className=`og-row ${dir}`;
    row.style.setProperty('--row-rgb',rowRgb);
    row.dataset.acc=rowRgb;
    row.setAttribute('onclick',`openDet('${g.key}')`);
    row.innerHTML=r?sideBlock+imgBlock:imgBlock+sideBlock;
    wrap.appendChild(row);
  });
}

// ── Detail popup ───────────────────────────────────────────────
function showPortrait(idx,color){
  document.querySelectorAll('.portrait-frame').forEach((f,i)=>{
    f.classList.toggle('visible',i===idx);
    f.classList.toggle('hidden',i!==idx);
  });
  document.querySelectorAll('.ptab').forEach((t,i)=>{
    t.classList.toggle('active',i===idx);
    t.style.borderLeft=i===idx?`2px solid ${color}`:'none';
  });
}

function radar(stats,color){
  const cx=105,cy=105,r=72,n=stats.length;
  const ang=i=>(Math.PI*2*i/n)-Math.PI/2;
  const pt=(i,rv)=>({x:cx+Math.cos(ang(i))*rv,y:cy+Math.sin(ang(i))*rv});
  const grids=[.25,.5,.75,1].map(s=>`<polygon points="${stats.map((_,i)=>{const p=pt(i,r*s);return p.x+','+p.y;}).join(' ')}" fill="none" stroke="rgba(250,247,242,.07)" stroke-width="0.5"/>`).join('');
  const axes=stats.map((_,i)=>{const p=pt(i,r);return`<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="rgba(250,247,242,.07)" stroke-width="0.5"/>`;}).join('');
  const valpts=stats.map((_,i)=>{const p=pt(i,r*stats[i].v/100);return p.x+','+p.y;}).join(' ');
  const dots=stats.map((s,i)=>{const p=pt(i,r*s.v/100);return`<circle cx="${p.x}" cy="${p.y}" r="2.5" fill="${color}"/>`;}).join('');
  const labels=stats.map((s,i)=>{const p=pt(i,r+16);const a=p.x<cx-4?'end':p.x>cx+4?'start':'middle';return`<text x="${p.x}" y="${p.y+3}" text-anchor="${a}" font-size="7" letter-spacing="0.8" fill="rgba(250,247,242,.38)" font-family="DM Sans,sans-serif">${s.n.toUpperCase()}</text>`;}).join('');
  return`<svg class="radar-svg" viewBox="0 0 210 210"><polygon points="${valpts}" fill="${color}" fill-opacity="0.12" stroke="${color}" stroke-width="1.5"/>${grids}${axes}${dots}${labels}</svg>`;
}

function openDet(key){
  const g=GIRLS.find(x=>x.key===key);
  const area=document.getElementById('portraitArea');
  area.innerHTML='';
  g.portraits.forEach((p,i)=>{
    const f=document.createElement('div');
    f.className='portrait-frame '+(i===0?'visible':'hidden');
    f.innerHTML=`<div class="portrait-inner" onclick="openPolar('${p.src}','${p.pos||'center top'}','${g.name}','${g.jp}')">
      <img src="${p.src}" alt="${g.name}" style="object-position:${p.pos||'center top'};">
    </div>`;
    area.appendChild(f);
  });
  document.getElementById('tabStrip').innerHTML=g.portraits.map((p,i)=>
    `<div class="ptab ${i===0?'active':''}" style="${i===0?'border-left:2px solid '+g.color+';':''}" onclick="showPortrait(${i},'${g.color}')">0${i+1}</div>`
  ).join('');
  // volumes → render ปุ่มทุก volume ที่ตัวละครนี้ปรากฏ
  const volBtns=g.volumes.map(v=>
    `<button class="di-read" onclick="goTo('${v.url}')">${v.label} ↗</button>`
  ).join('');
  const gIdx=GIRLS.findIndex(x=>x.key===key);
  const idxStr=String(gIdx+1).padStart(2,'0');
  const peakStat=g.stats.reduce((a,b)=>a.v>b.v?a:b);
  const softStat=g.stats.reduce((a,b)=>a.v<b.v?a:b);
  const colorRgb=g.color.replace('#','').match(/../g).map(h=>parseInt(h,16)).join(',');
  document.getElementById('detInfo').innerHTML=`
    <div class="di-vol">
      <div class="di-vol-dot" style="background:${g.color};"></div>
      <span class="di-vol-num">No. ${idxStr}</span>
    </div>
    <div class="di-name">${g.name}</div>
    <div class="di-jp">${g.jp}</div>
    <div class="di-motto">${g.motto_en}</div>
    <div class="di-tags">${g.tags.map(t=>'<span class="di-tag">'+t+'</span>').join('')}</div>
    <div class="di-sec">Personality Stats</div>
    <div class="di-stats-row">
      <div class="di-stat-card" style="border:0.5px solid rgba(${colorRgb},.22);background:rgba(${colorRgb},.05);">
        <div class="di-stat-lbl" style="color:rgba(${colorRgb},.58);">Peak</div>
        <div class="di-stat-val" style="color:${g.color};">${peakStat.v}</div>
        <div class="di-stat-name" style="color:rgba(250,247,242,.42);">${peakStat.n}</div>
      </div>
      ${radar(g.stats,g.color)}
      <div class="di-stat-card" style="border:0.5px solid rgba(250,247,242,.07);background:rgba(250,247,242,.02);">
        <div class="di-stat-lbl" style="color:rgba(250,247,242,.25);">Soft Spot</div>
        <div class="di-stat-val" style="color:rgba(250,247,242,.38);">${softStat.v}</div>
        <div class="di-stat-name" style="color:rgba(250,247,242,.28);">${softStat.n}</div>
      </div>
    </div>
    <div class="di-footer" style="gap:8px;flex-wrap:wrap;">${volBtns}</div>`;
  document.getElementById('detWrap').classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>{burst(innerWidth/2,innerHeight*0.38,g.color);},250);
  // re-bind hover for new ptabs
  bindHover();
}

// ── Polaroid lightbox ──────────────────────────────────────────
function openPolar(src,pos,nameEn,nameJp){
  const card=document.getElementById('polarCard');
  document.getElementById('polarImg').src=src;
  document.getElementById('polarImg').style.objectPosition=pos;
  document.getElementById('polarName').textContent=nameEn;
  document.getElementById('polarLabel').textContent=nameEn.toUpperCase();
  document.getElementById('polarSub').textContent=nameJp;
  card.classList.remove('revealed');           // เริ่มที่ด้านหลังเสมอ
  document.getElementById('plbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function flipPolar(e){
  e.stopPropagation();
  const card=document.getElementById('polarCard');
  // clear inline style → let CSS class handle flip transition
  card.style.transition='';
  card.style.transform='';
  card.classList.toggle('revealed');
}
function closePolar(){
  const card=document.getElementById('polarCard');
  const plbox=document.getElementById('plbox');
  if(card.classList.contains('revealed')){
    // พลิกกลับด้านหลังก่อน แล้วค่อย fade out
    card.style.transition='transform 0.75s cubic-bezier(.4,0,.2,1)';
    card.style.transform='';
    card.classList.remove('revealed');
    setTimeout(()=>{
      plbox.classList.remove('open');
      document.body.style.overflow='';
    },680);
  } else {
    card.style.transition='';
    card.style.transform='';
    plbox.classList.remove('open');
    document.body.style.overflow='';
  }
}
// ── 3D tilt + foil (front face only) ─────────────────────────
(function(){
  const card=document.getElementById('polarCard');
  card.addEventListener('mousemove',e=>{
    if(!card.classList.contains('revealed'))return;
    const r=card.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;   // -0.5 ~ 0.5
    const y=(e.clientY-r.top)/r.height-.5;
    const tX=(-y*15).toFixed(2);
    const tY=(x*11).toFixed(2);
    // fast follow during move
    card.style.transition='transform 0.07s linear';
    card.style.transform=`rotateX(${tX}deg) rotateY(${tY}deg) rotate(-1.8deg)`;
    // foil angle tracks tilt direction
    const angle=((Math.atan2(y,x)*180/Math.PI)+360)%360;
    card.style.setProperty('--mx',((x+.5)*100)+'%');
    card.style.setProperty('--my',((y+.5)*100)+'%');
    card.style.setProperty('--fr',angle+'deg');
  });
  card.addEventListener('mouseleave',()=>{
    if(!card.classList.contains('revealed'))return;
    // spring back to default resting tilt
    card.style.transition='transform 0.65s cubic-bezier(.25,.46,.45,.94)';
    card.style.transform='rotateY(0deg) rotate(-1.8deg)';
    card.style.setProperty('--mx','50%');
    card.style.setProperty('--my','50%');
  });
})();

function closeDet(){document.getElementById('detWrap').classList.remove('open');document.body.style.overflow='';}
let _leaving=false;
function goTo(url){
  if(_leaving)return;_leaving=true;
  try{const _a=document.querySelector('audio');if(_a&&!_a.paused){const _s=_a.volume/16;const _fi=setInterval(()=>{_a.volume=Math.max(0,_a.volume-_s);if(_a.volume<=0.001)clearInterval(_fi);},24);}}catch(e){}
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){window.location.href=url;return;}
  document.body.style.transition='opacity .42s ease,filter .42s ease,transform .42s ease';
  document.body.style.opacity='0';document.body.style.filter='blur(3px)';document.body.style.transform='scale(.992)';
  setTimeout(()=>{window.location.href=url;},420);
}

// ── Init ───────────────────────────────────────────────────────
document.body.style.opacity='0';
renderGallery();

window.addEventListener('load',()=>{
  document.body.style.transition='opacity .8s ease';
  document.body.style.opacity='1';
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on');});
  },{threshold:.06});
  document.querySelectorAll('.og-row').forEach(el=>obs.observe(el));
  bindHover();
});

// ── Cursor ─────────────────────────────────────────────────────
const cDot=document.getElementById('cDot'),cRing=document.getElementById('cRing');
let mx=0,my=0,rx=0,ry=0;
function bindHover(){
  if('ontouchstart' in window)return;
  document.querySelectorAll('.og-row,.det-close,.h-back,.di-read,.ptab').forEach(el=>{
    el.addEventListener('mouseenter',()=>document.body.classList.add('hov'));
    el.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));
  });
}
if(!('ontouchstart' in window)){
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cDot.style.left=mx+'px';cDot.style.top=my+'px';});
  (function a(){rx+=(mx-rx)*.1;ry+=(my-ry)*.1;cRing.style.left=rx+'px';cRing.style.top=ry+'px';requestAnimationFrame(a);})();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePolar();closeDet();}});

/* ═══════════ V2 — CONSTELLATION LAYER ═══════════ */
/* hero letter stagger */
(function(){
  const t=document.getElementById('heroTitle');
  const words=[{txt:'Our',em:false},{txt:'Girls',em:true}];
  let delay=0.4;
  words.forEach((wd,wi)=>{
    [...wd.txt].forEach(ch=>{
      const s=document.createElement('span');
      s.style.animationDelay=delay+'s';delay+=0.07;
      s.innerHTML=wd.em?`<em>${ch}</em>`:ch;
      t.appendChild(s);
    });
    if(wi===0){const sp=document.createElement('span');sp.innerHTML='&nbsp;';sp.style.animationDelay=delay+'s';t.appendChild(sp);}
  });
})();

/* names ticker from GIRLS data */
(function(){
  const tk=document.getElementById('gtTrack');
  const items=GIRLS.map(g=>`<span>${g.name} · ${g.jp} · ${g.colorName||''} <i style="color:${g.color};">✦</i></span>`).join('');
  tk.innerHTML=items+items;
})();

/* colored constellation starfield — each girl is a star */
(function(){
  const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
  let W,H,stars=[];
  const COLORS=GIRLS.map(g=>{
    const [r,gg,b]=g.color.replace('#','').match(/../g).map(h=>parseInt(h,16));
    return [r,gg,b];
  });
  function resize(){
    W=cv.width=innerWidth;H=cv.height=innerHeight;
    stars=Array.from({length:Math.min(110,W/12)},()=>{
      const colored=Math.random()<.3;
      return{
        x:Math.random()*W,y:Math.random()*H,
        r:Math.random()*1.3+.4,
        c:colored?COLORS[Math.floor(Math.random()*COLORS.length)]:[250,247,242],
        tw:Math.random()*Math.PI*2,
        sp:.03+Math.random()*.1,
        dx:(Math.random()-.5)*.04,
      };
    });
  }
  resize();addEventListener('resize',resize);
  function draw(){
    ctx.clearRect(0,0,W,H);
    const px=(mx/W-.5)*12,py=(my/H-.5)*8;
    stars.forEach(s=>{
      s.tw+=s.sp*.05;
      s.x+=s.dx;if(s.x<0)s.x=W;if(s.x>W)s.x=0;
      const a=.2+Math.abs(Math.sin(s.tw))*.5;
      ctx.beginPath();
      ctx.arc(s.x+px*s.r,s.y+py*s.r,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${s.c[0]},${s.c[1]},${s.c[2]},${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){}else requestAnimationFrame(draw);
})();

/* ambient glow follows cursor */
(function(){
  const glow=document.getElementById('glow');
  let gx=innerWidth/2,gy=innerHeight/2;
  (function loop(){
    gx+=(mx-gx)*.04;gy+=(my-gy)*.04;
    glow.style.left=gx+'px';glow.style.top=gy+'px';
    requestAnimationFrame(loop);
  })();
})();

/* accent takeover on row hover */
function setAcc(rgb){
  document.documentElement.style.setProperty('--acc-rgb',rgb);
  const[r,g,b]=rgb.split(',').map(Number);
  document.documentElement.style.setProperty('--acc',`rgb(${r},${g},${b})`);
}
function bindAccentRows(){
  document.querySelectorAll('.og-row').forEach(row=>{
    row.addEventListener('mouseenter',()=>setAcc(row.dataset.acc));
    row.addEventListener('mouseleave',()=>setAcc('196,164,100'));
  });
}

/* 3D tilt + shine on gallery images */
function bindTilt(){
  if('ontouchstart' in window)return;
  document.querySelectorAll('.og-row').forEach(row=>{
    const inner=row.querySelector('.og-img-inner');
    const img=inner?inner.querySelector('img'):null;
    const shine=row.querySelector('.og-shine');
    if(!inner||!img)return;
    row.addEventListener('mousemove',e=>{
      const r=inner.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      if(x<0||x>1||y<0||y>1)return;
      img.style.transition='transform .12s ease-out,filter .5s';
      img.style.transform=`scale(1.05) rotateY(${(x-.5)*2.2}deg) rotateX(${(y-.5)*-2.2}deg)`;
      if(shine){shine.style.setProperty('--sx',`${x*100}%`);shine.style.setProperty('--sy',`${y*100}%`);}
    });
    row.addEventListener('mouseleave',()=>{
      img.style.transition='transform .8s cubic-bezier(.22,1,.36,1),filter .5s';
      img.style.transform='none';
    });
  });
}

/* particle burst in girl color */
function burst(cx,cy,color){
  for(let i=0;i<26;i++){
    const p=document.createElement('div');p.className='gparticle';
    const a=(i/26)*Math.PI*2+(Math.random()-.5)*.5;
    const dist=46+Math.random()*100;
    const sz=1.5+Math.random()*3.5;
    const d=.45+Math.random()*.5;const dl=Math.random()*.12;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${color};--tx:${Math.cos(a)*dist}px;--ty:${Math.sin(a)*dist}px;--d:${d}s;--dl:${dl}s;`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),(d+dl)*1000+100);
  }
}

/* progress bar */
let _st1=false;
addEventListener('scroll',()=>{if(_st1)return;_st1=true;requestAnimationFrame(()=>{
  const el=document.documentElement;
  document.getElementById('rp-fill').style.width=(el.scrollTop/(el.scrollHeight-el.clientHeight))*100+'%';

/* ══ Sprint2b: magnetic buttons ══ */
(function(){
  if(('ontouchstart' in window)||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  const sel='.en-back,.ab,.vol-btn,.mh-mode,.mh-letter,.arc-btn,.di-read';
  document.querySelectorAll(sel).forEach(btn=>{
    const strength=0.32;
    const _ct=getComputedStyle(btn).transitionProperty;
    if(!/all|transform/.test(_ct))btn.style.transition=(getComputedStyle(btn).transition||'')+',transform .25s cubic-bezier(.22,1,.36,1)';
    btn.addEventListener('pointermove',e=>{
      const r=btn.getBoundingClientRect();
      const mx=e.clientX-(r.left+r.width/2), my=e.clientY-(r.top+r.height/2);
      btn.style.transform=`translate(${mx*strength}px,${my*strength}px)`;
    });
    btn.addEventListener('pointerleave',()=>{btn.style.transform='';});
  });
})();
